name: Test (minimal CI)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_suite:
        description: 'Run all unit tests (opt-in)'
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Two critical test files
        run: npm run test:smoke
      - name: Full suite (manual only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_suite }}
        run: npm test
